<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daftar — SanguKu</title>
<meta name="theme-color" content="#0d0f14">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{--bg:#0d0f14;--card:#151922;--card2:#1b202b;--soft:#11151d;--line:#242a36;--txt:#eef1f6;--muted:#98a2b3;--gold:#e6c068;--gold2:#c89b3f;--red:#f87171;--green:#4ade80}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:radial-gradient(700px 380px at 50% -8%,#1a2030,transparent 60%),var(--bg);
    color:var(--txt);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;-webkit-font-smoothing:antialiased}
  .shell{width:100%;max-width:420px}
  .brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:16px}
  .brand .dot{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:#1a1408;font-weight:900;font-size:26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
  h1{text-align:center;font-size:19px;font-weight:800;margin-bottom:4px}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .plan{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;background:var(--soft);position:relative;transition:.12s}
  .plan.sel{border-color:var(--gold);background:var(--card2);box-shadow:0 0 0 1px var(--gold) inset}
  .plan .pn{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .plan .pp{font-size:19px;font-weight:800;margin-top:3px}
  .plan .pop{position:absolute;top:-9px;right:8px;background:var(--gold);color:#1a1408;font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px}
  .plan.disabled{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
  .plan .pop.soon{background:var(--muted);color:#111}
  .detail{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .detail .old{color:var(--muted);text-decoration:line-through;font-size:14px}
  .detail .now{font-size:26px;font-weight:900;border-bottom:3px solid var(--gold);display:inline-block}
  .save-band{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;font-weight:800;text-align:center;padding:12px;border-radius:12px;margin-bottom:16px;font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:16px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;transition:.15s}
  .btn:hover{transform:translateY(-1px)} .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{display:none;font-size:13px;text-align:center;padding:11px;border-radius:11px;margin-top:12px}
  .foot{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
  .foot a{color:var(--gold);font-weight:700}
  #turnstile{margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><span class="dot">S</span></div>
  <div class="card">
    <h1>Buat akun SanguKu</h1>
    <div class="sub">Bayar sekali, pakai selamanya. Data tersinkron di semua perangkat.</div>

    <div class="plans" id="plans"></div>
    <div class="detail">
      <div><div id="dName" style="font-weight:800">Starter</div><div class="sub" style="text-align:left;margin:0">Akses selamanya</div></div>
      <div style="text-align:right"><div class="old" id="dOld">Rp 199.000</div><div class="now" id="dNow">Rp 99.000</div></div>
    </div>
    <div class="save-band">💳 <span id="saveTxt">HEMAT Rp 100.000</span></div>

    <form id="f" onsubmit="return doSignup(event)">
      <label>Email</label><input id="email" type="email" placeholder="kamu@email.com" required autocomplete="email">
      <label>Nomor HP (WhatsApp)</label><input id="phone" type="tel" placeholder="08xxxxxxxxxx" required autocomplete="tel">
      <label>Buat Password</label><input id="pass" type="password" placeholder="Min. 6 karakter" required autocomplete="new-password">
      <div id="turnstile"></div>
      <button class="btn" type="submit" id="btn">Lanjut ke Pembayaran →</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">Sudah punya akun? <a href="/login">Masuk</a></div>
  </div>
</div>
<script>
  /* ================= KONFIGURASI ================= */
  const SUPA_URL='https://stxahqcdmrzxopcqeyya.supabase.co';
  const SUPA_ANON='sb_publishable_1EdsbivyQLs-xT_ehe6-XA_PJZ94Vtb';
  const FORMULIR_URL='https://luarshop.form.id/sanguku';   // link form pembayaran formulir.com
  const TURNSTILE_SITEKEY='';   // opsional (anti-bot Cloudflare)
  const PLANS=[
    { id:'starter', name:'Starter', price:99000,  old:199000, popular:false, disabled:false },
    { id:'pro',     name:'Pro',     price:149000, old:299000, popular:false, disabled:true  }
  ];
  /* =============================================== */

  const sb=window.supabase.createClient(SUPA_URL,SUPA_ANON);
  const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
  let selected=PLANS[0].id;

  function renderPlans(){
    document.getElementById('plans').innerHTML=PLANS.map(p=>`
      <div class="plan ${p.id===selected?'sel':''} ${p.disabled?'disabled':''}" ${p.disabled?'':`onclick="selectPlan('${p.id}')"`}>
        ${p.disabled?'<span class="pop soon">Segera</span>':(p.popular?'<span class="pop">POPULER</span>':'')}<div class="pn">${p.name}</div><div class="pp">${rp(p.price)}</div></div>`).join('');
    const p=PLANS.find(x=>x.id===selected);
    document.getElementById('dName').textContent=p.name;
    document.getElementById('dOld').textContent=rp(p.old);
    document.getElementById('dNow').textContent=rp(p.price);
    document.getElementById('saveTxt').textContent='HEMAT '+rp(p.old-p.price);
  }
  function selectPlan(id){ const p=PLANS.find(x=>x.id===id); if(!p||p.disabled) return; selected=id; renderPlans(); }
  renderPlans();

  let tsToken='';
  if(TURNSTILE_SITEKEY){ const s=document.createElement('script'); s.src='https://challenges.cloudflare.com/turnstile/v0/api.js'; s.async=true; document.head.appendChild(s);
    window.onTs=t=>tsToken=t; document.getElementById('turnstile').innerHTML='<div class="cf-turnstile" data-sitekey="'+TURNSTILE_SITEKEY+'" data-callback="onTs"></div>'; }

  function showMsg(t,ok){ const m=document.getElementById('msg'); m.style.display='block'; m.textContent=t;
    m.style.color=ok?'var(--green)':'var(--red)'; m.style.background=ok?'rgba(74,222,128,.1)':'rgba(248,113,113,.1)'; }

  function goPay(email){
    if(!FORMULIR_URL){ showMsg('Akun dibuat! (Link pembayaran belum diatur.) Hubungi admin untuk aktivasi.',true); return; }
    const url=FORMULIR_URL+(FORMULIR_URL.includes('?')?'&':'?')+'plan='+selected+'&email='+encodeURIComponent(email);
    showMsg('Akun dibuat! Mengarahkan ke pembayaran...',true);
    setTimeout(()=>{ location.href=url; }, 900);
  }

  async function doSignup(e){
    e.preventDefault();
    const email=document.getElementById('email').value.trim();
    const phone=document.getElementById('phone').value.trim();
    const pass=document.getElementById('pass').value;
    if(!email||!phone||pass.length<6){ showMsg('Lengkapi data (password min. 6 karakter).',false); return false; }
    if(TURNSTILE_SITEKEY && !tsToken){ showMsg('Selesaikan verifikasi anti-bot dulu.',false); return false; }
    const btn=document.getElementById('btn'); btn.disabled=true; btn.textContent='Memproses...';
    const {data,error}=await sb.auth.signUp({ email, password:pass, options:{ data:{ phone, plan:selected } } });
    if(error){
      if((error.message||'').toLowerCase().includes('registered')){ showMsg('Email sudah terdaftar. Silakan Masuk.',false); }
      else showMsg('Gagal: '+error.message,false);
      btn.disabled=false; btn.textContent='Lanjut ke Pembayaran →'; return false;
    }
    goPay(email);
    return false;
  }
</script>
</body>
</html>
